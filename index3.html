<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script><script src="js/core.js"></script>
    <script src="js/arm.js"></script><script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script><script src="js/io.js"></script>
    <script src="js/audio.js"></script><script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script><script src="js/video/software.js"></script>
    <script src="js/irq.js"></script><script src="js/keypad.js"></script>
    <script src="js/sio.js"></script><script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script><script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        /* 嚴格禁止 iOS 預設行為與選取 */
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; outline: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 畫面增大 (從 35vh 變更為 48vh) */
        #game-area { 
            position: relative;
            width: 100vw; height: 48vh; 
            display: flex; justify-content: center; align-items: center; 
            margin-top: env(safe-area-inset-top, 10px);
            background: #000;
        }
        canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 3/2; image-rendering: pixelated; }

        /* 融入式跑馬燈：由核心循環每一幀同步繪製在 Canvas 內部 */

        /* 按鍵區：模仿 Game Boy 實體佈局 */
        .controls-grid { 
            flex: 1; width: 100%; display: flex; flex-direction: column; 
            justify-content: space-evenly; align-items: center;
            padding-bottom: env(safe-area-inset-bottom, 20px); 
        }
        .row { display: flex; justify-content: center; gap: 15px; width: 100%; }
        
        /* 十字鍵樣式 */
        .cross { position: relative; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; }
        .k { 
            position: absolute; width: 33.33px; height: 33.33px; 
            background: #111; border: 1px solid #333; 
            display: flex; align-items: center; justify-content: center; 
            color: #fff; font-size: 16px; font-weight: bold;
        }
        #btn-u { top: 0; left: 33.33px; border-radius: 4px 4px 0 0; }
        #btn-d { bottom: 0; left: 33.33px; border-radius: 0 0 4px 4px; }
        #btn-l { left: 0; top: 33.33px; border-radius: 4px 0 0 4px; }
        #btn-r { right: 0; top: 33.33px; border-radius: 0 4px 4px 0; }
        
        /* 圓形紅色 A/B 鍵 */
        .round { width: 75px; height: 75px; border-radius: 50%; background: #b22; color: #fff; font-size: 18px; }
        
        /* 楕圓 Select/Start 灰色鍵 */
        .oval { width: 90px; height: 36px; border-radius: 18px; background: #555; color: #fff; font-size: 11px; }

        .k:active { background: #333; transform: scale(0.95); }
        .round:active { background: #d44; transform: scale(0.95); }
        .oval:active { background: #777; transform: scale(0.95); }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;
        var marqueePos = 240;

        // V21 成功的 KeyboardEvent 注入 keyCode (gbajs 映射)
        const K = { UP:38, DOWN:40, LEFT:37, RIGHT:39, A:90, B:88, START:13, SELECT:16 };

        try { gba = new GameBoyAdvance(); } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = " ★ " + decodeURIComponent(msgParam) + " ★ ";
                type();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 50);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        // --- V23：深度同步跑馬燈循環 ---
        function syncLoop() {
            if (gba && gba.context) {
                // 手動在畫布上每一幀都畫一個文字條，防止被蓋掉
                const canvas = document.getElementById('screen');
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(0, 0, 240, 16);
                ctx.font = "11px monospace";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(customMsg, marqueePos, 12);
                marqueePos -= 1.0;
                if (marqueePos < -ctx.measureText(customMsg).width) marqueePos = 240;
            }
            requestAnimationFrame(syncLoop);
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            // 聲音解鎖 (V21 成功的方案)
            if (gba.audio && gba.audio.context) gba.audio.context.resume();
            
            try {
                const res = await fetch("game.gba");
                const blob = await res.blob();
                gba.loadRomFromFile(new File([blob], "game.gba"), (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                        syncLoop(); // 啟動同步跑馬燈
                    }
                });
            } catch (e) { alert("Load Error"); }
        }

        // --- 核心：全域事件注入器 ---
        function triggerKey(code, type) {
            const event = new KeyboardEvent(type, {
                keyCode: code,
                which: code,
                bubbles: true,
                cancelable: true
            });
            window.dispatchEvent(event);
        }

        function setupBtn(id, keyCode) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); triggerKey(keyCode, 'keydown'); };
            const end = (e) => { e.preventDefault(); triggerKey(keyCode, 'keyup'); };
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        const initButtons = setInterval(() => {
            if (gba) {
                // 將 V21 的 keyCode 綁定到新的實體比照按鈕
                setupBtn('btn-u', K.UP); setupBtn('btn-d', K.DOWN);
                setupBtn('btn-l', K.LEFT); setupBtn('btn-r', K.RIGHT);
                setupBtn('btn-a', K.A); setupBtn('btn-b', K.B);
                setupBtn('btn-st', K.START); setupBtn('se-marker', K.SELECT);
                clearInterval(initButtons);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">庭瑜生日快樂🎂25 forever</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('Copied'));" style="background:var(--p); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:bold;">生成連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter" style="padding:20px; font-family: monospace; line-height: 1.6;"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p); font-size:12px;">● CLICK TO START ●</div>
    </div>

    <div id="game-area">
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div class="controls-grid">
        <div class="row">
            <div class="cross">
                <div class="k" id="btn-u">↑</div>
                <div class="k" id="btn-d">↓</div>
                <div class="k" id="btn-l">←</div>
                <div class="k" id="btn-r">→</div>
            </div>
            <div style="font-size: 11px; display: flex; flex-direction: column; gap: 5px;">
                <span id="st-marker">START</span>
                <span id="se-marker">SELECT</span>
            </div>
        </div>
        
        <div class="row" style="gap: 50px;">
            <div class="round k" id="btn-b">B</div>
            <div class="round k" id="btn-a">A</div>
        </div>
        
        <div class="row">
            <div class="oval k" id="btn-st"></div> <div class="oval k" id="btn-se"></div> </div>

        <div style="font-size: 12px; margin-top: 10px;">Nintendo GAME BOY</div>
    </div>

</body>
</html>
