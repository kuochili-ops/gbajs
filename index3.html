<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script><script src="js/core.js"></script>
    <script src="js/arm.js"></script><script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script><script src="js/io.js"></script>
    <script src="js/audio.js"></script><script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script><script src="js/video/software.js"></script>
    <script src="js/irq.js"></script><script src="js/keypad.js"></script>
    <script src="js/sio.js"></script><script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script><script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; --gb-grey: #2d2d2d; --gb-red: #a31a48; --body-bg: #1a1a1a; }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; outline: none; box-sizing: border-box; }
        body { background: var(--body-bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 1. 遊戲畫面區域：縮小並絕對置中 */
        #game-area { 
            width: 100vw; height: 45vh; 
            display: flex; justify-content: center; align-items: center; 
            padding: 20px;
            margin-top: env(safe-area-inset-top, 10px);
        }

        .screen-frame {
            position: relative;
            background: #333;
            width: 88vw; max-width: 400px;
            aspect-ratio: 240 / 180;
            border-radius: 10px 10px 50px 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; /* 內部元素完全置中 */
        }

        canvas { 
            display: block; 
            width: 80% !important; /* 縮小比例以確保不被裁切 */
            height: auto !important;
            aspect-ratio: 3 / 2;
            image-rendering: pixelated; 
            background: #000;
            border: 2px solid #000;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* 2. 控制區修正 */
        .gb-controls { 
            flex: 1; width: 100%; 
            display: flex; flex-direction: column;
            justify-content: space-evenly;
            padding: 0 30px;
            padding-bottom: env(safe-area-inset-bottom, 25px);
        }

        .main-row { display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative; }

        /* 十字鍵修正：確保左上區塊顏色與機身一致 */
        .d-pad { position: relative; width: 120px; height: 120px; background: transparent; }
        .d-pad .k { 
            position: absolute; background: var(--gb-grey); 
            box-shadow: 0 4px 0 #000; 
            border: 1px solid #111; 
            z-index: 2;
        }
        #btn-u { top: 0; left: 42px; width: 36px; height: 45px; border-radius: 4px 4px 0 0; }
        #btn-d { bottom: 0; left: 42px; width: 36px; height: 45px; border-radius: 0 0 4px 4px; }
        #btn-l { left: 0; top: 42px; width: 45px; height: 36px; border-radius: 4px 0 0 4px; }
        #btn-r { right: 0; top: 42px; width: 45px; height: 36px; border-radius: 0 4px 4px 0; }
        #btn-center { top: 42px; left: 42px; width: 36px; height: 36px; background: var(--gb-grey); z-index: 1; box-shadow: none; border: none; }

        /* AB 鍵 */
        .action-btns { position: relative; width: 130px; height: 100px; }
        .round-k { 
            position: absolute; width: 58px; height: 58px; border-radius: 50%; 
            background: var(--gb-red); border: 2px solid #500;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px; color: rgba(255,255,255,0.6);
            box-shadow: 0 5px 0 #500;
        }
        #btn-b { left: 0; bottom: 5px; }
        #btn-a { right: 0; top: 5px; }

        /* Select / Start */
        .sys-row { display: flex; justify-content: center; gap: 40px; margin-top: -10px; }
        .sys-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .oval-k { 
            width: 52px; height: 16px; background: #444; border-radius: 10px;
            transform: rotate(-25deg);
            box-shadow: 0 3px 0 #111;
        }
        .sys-label { font-size: 10px; color: #444; font-weight: bold; transform: rotate(-25deg); text-shadow: 1px 1px 0 rgba(255,255,255,0.05); }

        .k:active, .round-k:active, .oval-k:active { transform: translateY(2px) !important; box-shadow: none !important; filter: brightness(1.2); }

        #setup-ui, #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;
        var marqueePos = 240;
        const K = { UP:38, DOWN:40, LEFT:37, RIGHT:39, A:90, B:88, START:13, SELECT:16 };

        try { gba = new GameBoyAdvance(); } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = " ★ " + decodeURIComponent(msgParam) + " ★ ";
                type();
            } else { document.getElementById('intro-overlay').style.display = 'none'; }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 50);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        function syncLoop() {
            if (gba && gba.context) {
                const canvas = document.getElementById('screen');
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, 240, 16);
                ctx.font = "bold 11px monospace";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(customMsg, marqueePos, 12);
                marqueePos -= 0.8;
                if (marqueePos < -ctx.measureText(customMsg).width) marqueePos = 240;
            }
            requestAnimationFrame(syncLoop);
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            if (gba.audio && gba.audio.context) gba.audio.context.resume();
            try {
                const res = await fetch("game.gba");
                const blob = await res.blob();
                gba.loadRomFromFile(new File([blob], "game.gba"), (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                        syncLoop();
                    }
                });
            } catch (e) { alert("Load Failed"); }
        }

        function triggerKey(code, type) {
            const event = new KeyboardEvent(type, { keyCode: code, which: code, bubbles: true });
            window.dispatchEvent(event);
        }

        function setupBtn(id, keyCode) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); triggerKey(keyCode, 'keydown'); };
            const end = (e) => { e.preventDefault(); triggerKey(keyCode, 'keyup'); };
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
        }

        const init = setInterval(() => {
            if (gba) {
                setupBtn('btn-u', K.UP); setupBtn('btn-d', K.DOWN);
                setupBtn('btn-l', K.LEFT); setupBtn('btn-r', K.RIGHT);
                setupBtn('btn-a', K.A); setupBtn('btn-b', K.B);
                setupBtn('btn-st', K.START); setupBtn('btn-se', K.SELECT);
                clearInterval(init);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">庭瑜生日快樂🎂25 forever</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('連結已複製'));" style="background:var(--p); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:bold;">生成連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter" style="padding:20px; font-family: monospace; line-height: 1.6;"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p); font-size:12px;">● CLICK TO START ●</div>
    </div>

    <div id="game-area">
        <div class="screen-frame">
            <canvas id="screen" width="240" height="160"></canvas>
        </div>
    </div>

    <div class="gb-controls">
        <div class="main-row">
            <div class="d-pad">
                <div class="k" id="btn-u"></div>
                <div class="k" id="btn-d"></div>
                <div class="k" id="btn-l"></div>
                <div class="k" id="btn-r"></div>
                <div id="btn-center"></div>
            </div>
            <div class="action-btns">
                <div class="round-k" id="btn-b">B</div>
                <div class="round-k" id="btn-a">A</div>
            </div>
        </div>

        <div class="sys-row">
            <div class="sys-group">
                <div class="oval-k" id="btn-se"></div>
                <div class="sys-label">SELECT</div>
            </div>
            <div class="sys-group">
                <div class="oval-k" id="btn-st"></div>
                <div class="sys-label">START</div>
            </div>
        </div>
        
        <div style="text-align:center; color:#333; font-size:10px; font-weight:bold; letter-spacing:4px; margin-bottom:10px;">Nintendo GAME BOY</div>
    </div>

</body>
</html>
