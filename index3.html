<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script><script src="js/core.js"></script>
    <script src="js/arm.js"></script><script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script><script src="js/io.js"></script>
    <script src="js/audio.js"></script><script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script><script src="js/video/software.js"></script>
    <script src="js/irq.js"></script><script src="js/keypad.js"></script>
    <script src="js/sio.js"></script><script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script><script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; --gb-body: #1a1a1a; --gb-grey: #2d2d2d; --gb-red: #a31a48; --screen-green: #9bbc0f; }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            user-select: none; 
            touch-action: none;          
            outline: none; 
            box-sizing: border-box; 
        }

        body { 
            background: var(--gb-body); 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            position: fixed;
            width: 100%;
        }
        
        #game-area { width: 100vw; height: 42vh; display: flex; justify-content: center; align-items: center; padding-top: 10px; }

        .screen-frame {
            position: relative;
            background: #333;
            width: 88vw; max-width: 400px;
            aspect-ratio: 3 / 2.2;
            border-radius: 12px 12px 50px 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
        }

        #screen-inner {
            position: relative;
            width: 90%; height: 85%;
            background: #000;
            border: 4px solid #181818;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        canvas#screen { 
            display: none; 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.65); 
            transform-origin: center;
            image-rendering: pixelated; 
            z-index: 5;
        }

        /* 互動訊息標籤 (Toast) */
        #action-toast {
            position: absolute; bottom: 20%; left: 50%;
            transform: translateX(-50%);
            background: rgba(107, 80, 156, 0.8);
            color: white; padding: 5px 15px; border-radius: 20px;
            font-size: 12px; font-weight: bold;
            opacity: 0; transition: opacity 0.2s;
            z-index: 120; pointer-events: none;
            white-space: nowrap;
        }

        #intro-layer {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #0f380f; font-family: monospace; font-weight: bold;
            padding: 15px; text-align: center; z-index: 100;
            background: var(--screen-green);
        }

        #marquee-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.4); 
            color: #fff; font-size: 14px; font-weight: bold;
            padding: 5px 0; white-space: nowrap; overflow: hidden;
            display: none; z-index: 110;
            backdrop-filter: blur(2px);
        }
        #marquee-text { display: inline-block; padding-left: 100%; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .gb-controls { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: space-evenly; padding: 0 30px; padding-bottom: env(safe-area-inset-bottom, 20px); }
        .main-row { display: flex; justify-content: space-between; align-items: center; }
        
        .d-pad { position: relative; width: 120px; height: 120px; }
        .d-pad .k { position: absolute; background: var(--gb-grey); box-shadow: 0 4px 0 #000; border: 1px solid #111; z-index: 10; transition: transform 0.1s; }
        .d-pad .k:active { transform: scale(0.95); }
        
        #btn-u { top: 0; left: 42px; width: 36px; height: 46px; border-radius: 4px 4px 0 0; }
        #btn-d { bottom: 0; left: 42px; width: 36px; height: 46px; border-radius: 0 0 4px 4px; }
        #btn-l { left: 0; top: 42px; width: 46px; height: 36px; border-radius: 4px 0 0 4px; }
        #btn-r { right: 0; top: 42px; width: 46px; height: 36px; border-radius: 0 4px 4px 0; }

        .action-btns { position: relative; width: 140px; height: 110px; }
        .round-k { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: var(--gb-red); border: 2px solid #500; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; color: rgba(255,255,255,0.7); box-shadow: 0 5px 0 #500; transition: transform 0.1s; }
        .round-k:active { transform: translateY(3px); box-shadow: 0 2px 0 #500; }
        #btn-b { left: 0; bottom: 0; }
        #btn-a { right: 0; top: 0; }

        .sys-row { display: flex; justify-content: center; gap: 40px; }
        .oval-k { width: 54px; height: 18px; background: #444; border-radius: 10px; transform: rotate(-25deg); box-shadow: 0 3px 0 #111; }
        .sys-label { font-size: 10px; color: #444; font-weight: bold; transform: rotate(-25deg); margin-top: 5px; }

        #setup-ui { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;
        var toastTimer;
        const K = { UP:38, DOWN:40, LEFT:37, RIGHT:39, A:90, B:88, START:13, SELECT:16 };

        window.oncontextmenu = function(e) { e.preventDefault(); return false; };

        try { gba = new GameBoyAdvance(); gba.keypad.eatInput = true; } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            customMsg = msgParam ? decodeURIComponent(msgParam) : "親友們❤️早安";
            document.getElementById('msgInput').value = customMsg;
            document.getElementById('marquee-text').innerText = " ★ " + customMsg + " ★ ";
            type();
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('type-content');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 100);
            } else { document.getElementById('start-hint').style.opacity = 1; }
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            if (gba.audio && gba.audio.context && gba.audio.context.state === 'suspended') gba.audio.context.resume();
            try {
                const res = await fetch("game.gba");
                const blob = await res.blob();
                gba.loadRomFromFile(new File([blob], "game.gba"), (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-layer').style.display = 'none';
                        document.getElementById('screen').style.display = 'block';
                        document.getElementById('marquee-bar').style.display = 'block';
                    }
                });
            } catch (e) { alert("ROM Load Failed"); }
        }

        // 顯示按鍵動作訊息
        function showActionMsg(dir) {
            const toast = document.getElementById('action-toast');
            const messages = {
                'UP': '向上探索中 ➚',
                'DOWN': '向下移動中 ➘',
                'LEFT': '往左走走 ⇠',
                'RIGHT': '向右前進 ⇢',
                'A': '確認 / 跳躍 ⚡',
                'B': '取消 / 加速 💨'
            };
            toast.innerText = messages[dir] || dir;
            toast.style.opacity = 1;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 800);
        }

        function triggerKey(code, type, dirName) {
            window.dispatchEvent(new KeyboardEvent(type, { keyCode: code }));
            if (type === 'keydown' && dirName) showActionMsg(dirName);
        }

        function setupBtn(id, keyCode, dirName) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                if(id === 'btn-st') runGame();
                triggerKey(keyCode, 'keydown', dirName); 
            }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); triggerKey(keyCode, 'keyup'); }, {passive: false});
        }

        const init = setInterval(() => {
            if (gba) {
                const names = ['UP','DOWN','LEFT','RIGHT','A','B','START','SELECT'];
                const ids = ['btn-u','btn-d','btn-l','btn-r','btn-a','btn-b','btn-st','btn-se'];
                const keys = [K.UP, K.DOWN, K.LEFT, K.RIGHT, K.A, K.B, K.START, K.SELECT];
                ids.forEach((id, idx) => setupBtn(id, keys[idx], names[idx]));
                clearInterval(init);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">親友們❤️早安</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('連結已複製'));" style="background:var(--p); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:bold;">生成連結</button>
    </div>

    <div id="game-area">
        <div class="screen-frame">
            <div id="screen-inner">
                <div id="intro-layer">
                    <div id="type-content"></div>
                    <div id="start-hint" style="margin-top:20px; opacity:0; font-size:10px; animation: blink 1s infinite;">● PRESS START ●</div>
                </div>
                <div id="marquee-bar"><span id="marquee-text"></span></div>
                <div id="action-toast"></div>
                <canvas id="screen" width="480" height="320"></canvas>
            </div>
        </div>
    </div>

    <div class="gb-controls">
        <div class="main-row">
            <div class="d-pad">
                <div class="k" id="btn-u"></div><div class="k" id="btn-d"></div>
                <div class="k" id="btn-l"></div><div class="k" id="btn-r"></div>
            </div>
            <div class="action-btns">
                <div class="round-k" id="btn-b">B</div>
                <div class="round-k" id="btn-a">A</div>
            </div>
        </div>
        <div class="sys-row">
            <div class="sys-group"><div class="oval-k" id="btn-se"></div><div class="sys-label">SELECT</div></div>
            <div class="sys-group"><div class="oval-k" id="btn-st"></div><div class="sys-label">START</div></div>
        </div>
        <div style="text-align:center; color:#333; font-size:10px; font-weight:bold; letter-spacing:4px; margin-top:10px;">Nintendo GAME BOY</div>
    </div>

</body>
</html>
