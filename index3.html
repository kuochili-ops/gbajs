<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script><script src="js/core.js"></script>
    <script src="js/arm.js"></script><script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script><script src="js/io.js"></script>
    <script src="js/audio.js"></script><script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script><script src="js/video/software.js"></script>
    <script src="js/irq.js"></script><script src="js/keypad.js"></script>
    <script src="js/sio.js"></script><script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script><script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        /* 嚴格禁止系統干擾 */
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; outline: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        #game-area { width: 100vw; height: 35vh; display: flex; justify-content: center; align-items: center; margin-top: env(safe-area-inset-top, 10px); }
        canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 3/2; image-rendering: pixelated; }

        .pad { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: space-evenly; padding-bottom: env(safe-area-inset-bottom, 20px); }
        .row { display: flex; justify-content: center; gap: 12px; width: 100%; }
        .k { 
            width: 72px; height: 72px; background: rgba(255,255,255,0.15); 
            border: 2px solid #555; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; font-weight: bold; color: #fff;
            box-shadow: 0 4px 0 #222;
        }
        .sys { width: 85px; height: 35px; border-radius: 8px; font-size: 11px; background: rgba(255,255,255,0.1); }
        .k:active { background: var(--p); transform: translateY(2px); box-shadow: 0 2px 0 #111; }

        #setup-ui, #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;
        var marqueePos = 240;
        
        // --- V20 新增：全域輸入狀態機 ---
        var inputs = {
            up: false, down: false, left: false, right: false,
            a: false, b: false, start: false, select: false
        };

        try {
            gba = new GameBoyAdvance();
            gba.keypad.eatInput = true;
        } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = " ★ " + decodeURIComponent(msgParam).replace(/\n/g, " ") + " ★ ";
                type();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 50);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        // --- V20 核心循環：強迫每一幀同步按鍵狀態 ---
        function syncLoop() {
            if (gba && gba.keypad) {
                // 如果 Map 裡是 true，就呼叫 keydown，否則呼叫 keyup
                inputs.up ? gba.keypad.keydown(gba.keypad.UP) : gba.keypad.keyup(gba.keypad.UP);
                inputs.down ? gba.keypad.keydown(gba.keypad.DOWN) : gba.keypad.keyup(gba.keypad.DOWN);
                inputs.left ? gba.keypad.keydown(gba.keypad.LEFT) : gba.keypad.keyup(gba.keypad.LEFT);
                inputs.right ? gba.keypad.keydown(gba.keypad.RIGHT) : gba.keypad.keyup(gba.keypad.RIGHT);
                inputs.a ? gba.keypad.keydown(gba.keypad.A) : gba.keypad.keyup(gba.keypad.A);
                inputs.b ? gba.keypad.keydown(gba.keypad.B) : gba.keypad.keyup(gba.keypad.B);
                inputs.start ? gba.keypad.keydown(gba.keypad.START) : gba.keypad.keyup(gba.keypad.START);
                inputs.select ? gba.keypad.keydown(gba.keypad.SELECT) : gba.keypad.keyup(gba.keypad.SELECT);
                
                // 順便畫跑馬燈
                const ctx = document.getElementById('screen').getContext('2d');
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(0, 0, 240, 16);
                ctx.font = "11px monospace";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(customMsg, marqueePos, 12);
                marqueePos -= 1.0;
                if (marqueePos < -ctx.measureText(customMsg).width) marqueePos = 240;
            }
            requestAnimationFrame(syncLoop);
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            if (gba.audio && gba.audio.context) gba.audio.context.resume();
            
            try {
                const res = await fetch("game.gba");
                const blob = await res.blob();
                gba.loadRomFromFile(new File([blob], "game.gba"), (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                        syncLoop(); // 啟動同步循環
                    }
                });
            } catch (e) { alert("ERROR"); }
        }

        // --- V20：極簡化的按鍵監聽，只負責修改狀態 Map ---
        function setupBtn(id, keyName) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); inputs[keyName] = true; };
            const end = (e) => { e.preventDefault(); inputs[keyName] = false; };
            
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
            el.addEventListener('touchcancel', end, {passive: false});
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        const timer = setInterval(() => {
            if (gba) {
                setupBtn('u', 'up'); setupBtn('d', 'down');
                setupBtn('l', 'left'); setupBtn('r', 'right');
                setupBtn('a', 'a'); setupBtn('b', 'b');
                setupBtn('st', 'start'); setupBtn('se', 'select');
                clearInterval(timer);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">庭瑜生日快樂🎂25 forever</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('已複製連結'));" style="background:var(--p); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:bold;">生成連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter" style="padding:20px; font-family: monospace; line-height: 1.6;"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p); font-size:12px;">● CLICK TO START ●</div>
    </div>

    <div id="game-area">
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div class="pad">
        <div class="row">
            <div class="k sys" id="st">START</div>
            <div class="k" id="u">↑</div>
            <div class="k sys" id="se">SELECT</div>
        </div>
        <div class="row">
            <div class="k" id="l">←</div>
            <div class="k" id="d">↓</div>
            <div class="k" id="r">→</div>
        </div>
        <div class="row" style="gap: 50px; margin-top: 5px;">
            <div class="k" id="b" style="background:rgba(255,80,80,0.3);">B</div>
            <div class="k" id="a" style="background:rgba(80,255,80,0.3);">A</div>
        </div>
    </div>

</body>
</html>
