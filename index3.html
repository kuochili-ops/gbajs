<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script><script src="js/core.js"></script>
    <script src="js/arm.js"></script><script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script><script src="js/io.js"></script>
    <script src="js/audio.js"></script><script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script><script src="js/video/software.js"></script>
    <script src="js/irq.js"></script><script src="js/keypad.js"></script>
    <script src="js/sio.js"></script><script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script><script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; outline: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 畫面增大 1/3 (從 35vh 變更為 48vh) */
        #game-area { 
            position: relative;
            width: 100vw; height: 48vh; 
            display: flex; justify-content: center; align-items: center; 
            margin-top: env(safe-area-inset-top, 10px);
            background: #000;
        }
        canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 3/2; image-rendering: pixelated; }

        /* 訊息層：疊加在 Canvas 之上 */
        #msg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 24px;
            background: rgba(0,0,0,0.5); overflow: hidden; pointer-events: none;
            display: flex; align-items: center; z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        #marquee { white-space: nowrap; font-family: monospace; font-size: 14px; animation: slide 15s linear infinite; }
        @keyframes slide { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }

        /* 按鍵區佈局優化 */
        .pad { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding-bottom: env(safe-area-inset-bottom, 20px); }
        .row { display: flex; justify-content: center; gap: 15px; width: 100%; }
        .k { 
            width: 75px; height: 75px; background: rgba(255,255,255,0.1); 
            border: 2px solid #444; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; font-weight: bold; color: #fff;
            box-shadow: 0 4px 0 #222;
        }
        .sys { width: 90px; height: 35px; border-radius: 8px; font-size: 11px; }
        .k:active { background: var(--p); transform: translateY(3px); box-shadow: none; }

        #setup-ui, #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;

        // GBA 鍵盤映射碼 (gbajs 預設)
        const K = { UP:38, DOWN:40, LEFT:37, RIGHT:39, A:90, B:88, START:13, SELECT:16 };

        try {
            gba = new GameBoyAdvance();
        } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = " ★ " + decodeURIComponent(msgParam) + " ★ ";
                document.getElementById('marquee').innerText = customMsg;
                type();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 50);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            if (gba.audio && gba.audio.context) gba.audio.context.resume();
            
            try {
                const res = await fetch("game.gba");
                const blob = await res.blob();
                gba.loadRomFromFile(new File([blob], "game.gba"), (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                    }
                });
            } catch (e) { alert("ERROR"); }
        }

        // --- V21 核心：全域事件注入器 ---
        function triggerKey(code, type) {
            const event = new KeyboardEvent(type, {
                keyCode: code,
                which: code,
                bubbles: true,
                cancelable: true
            });
            window.dispatchEvent(event);
        }

        function setupBtn(id, keyCode) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); triggerKey(keyCode, 'keydown'); };
            const end = (e) => { e.preventDefault(); triggerKey(keyCode, 'keyup'); };
            
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        const initButtons = setInterval(() => {
            if (gba) {
                setupBtn('u', K.UP); setupBtn('d', K.DOWN);
                setupBtn('l', K.LEFT); setupBtn('r', K.RIGHT);
                setupBtn('a', K.A); setupBtn('b', K.B);
                setupBtn('st', K.START); setupBtn('se', K.SELECT);
                clearInterval(initButtons);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">庭瑜生日快樂🎂25 forever</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('已複製連結'));" style="background:var(--p); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:bold;">生成連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter" style="padding:20px; font-family: monospace; line-height: 1.6;"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p); font-size:12px;">● CLICK TO START ●</div>
    </div>

    <div id="game-area">
        <div id="msg-overlay"><div id="marquee"></div></div>
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div class="pad">
        <div class="row" style="margin-bottom: -10px;">
            <div class="k sys" id="st">START</div>
            <div class="k sys" id="se">SELECT</div>
        </div>
        <div class="row">
            <div class="k" id="u">↑</div>
        </div>
        <div class="row">
            <div class="k" id="l">←</div>
            <div class="k" id="d">↓</div>
            <div class="k" id="r">→</div>
        </div>
        <div class="row" style="gap: 40px;">
            <div class="k" id="b" style="background:rgba(255,80,80,0.2); border-color:#f88;">B</div>
            <div class="k" id="a" style="background:rgba(80,255,80,0.2); border-color:#8f8;">A</div>
        </div>
    </div>

</body>
</html>
