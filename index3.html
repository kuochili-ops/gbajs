<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/video/software.js"></script>
    <script src="js/irq.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/sio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        * { -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; outline: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        #game-area {
            width: 100vw; height: 35vh; display: flex; justify-content: center; align-items: center;
            margin-top: env(safe-area-inset-top, 10px); background: #000;
        }
        canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }

        .pad { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: space-evenly; padding-bottom: env(safe-area-inset-bottom, 25px); }
        .row { display: flex; justify-content: center; gap: 12px; width: 100%; }
        .k { 
            width: 74px; height: 74px; background: rgba(255,255,255,0.15); 
            border: 2px solid #444; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; font-weight: bold; color: #fff;
            box-shadow: 0 4px 0 #222;
        }
        .sys { width: 90px; height: 36px; border-radius: 8px; font-size: 12px; background: rgba(255,255,255,0.1); }
        .k:active { background: var(--p); transform: translateY(3px); box-shadow: none; border-color: #fff; }

        #setup-ui, #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;
        var marqueePos = 240;

        try {
            gba = new GameBoyAdvance();
            // 重要：取消預設吃掉輸入，改用自定義處理
            gba.keypad.eatInput = false;
        } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = decodeURIComponent(msgParam).replace(/\n/g, "  ★  ");
                typeIntro();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function typeIntro() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(typeIntro, 50);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        function drawMarquee() {
            const canvas = document.getElementById('screen');
            const ctx = canvas.getContext('2d');
            function loop() {
                if (gba && gba.context) {
                    ctx.fillStyle = "rgba(0,0,0,0.4)";
                    ctx.fillRect(0, 0, 240, 16);
                    ctx.font = "11px monospace";
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(customMsg, marqueePos, 12);
                    marqueePos -= 1.0;
                    if (marqueePos < -ctx.measureText(customMsg).width) marqueePos = 240;
                }
                requestAnimationFrame(loop);
            }
            loop();
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            // 解鎖音訊
            if (gba.audio && gba.audio.context) {
                gba.audio.context.resume();
            }
            try {
                const res = await fetch("game.gba");
                const blob = await res.blob();
                gba.loadRomFromFile(new File([blob], "game.gba"), (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                        drawMarquee();
                    }
                });
            } catch (e) { alert("ERROR"); }
        }

        // --- 核心改進：模擬官網鍵盤事件處理 ---
        function bind(id, gbaKey) {
            const el = document.getElementById(id);
            
            // 參考官網：建立模擬事件
            const press = (e) => {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                // 直接調用內部的鍵盤處理函數，而非高層介面
                if (gba.keypad.keyboard) {
                    gba.keypad.keyboard.processKey({
                        keyCode: gbaKey,
                        type: 'keydown',
                        preventDefault: () => {}
                    });
                } else {
                    gba.keypad.keydown(gbaKey);
                }
            };

            const release = (e) => {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (gba.keypad.keyboard) {
                    gba.keypad.keyboard.processKey({
                        keyCode: gbaKey,
                        type: 'keyup',
                        preventDefault: () => {}
                    });
                } else {
                    gba.keypad.keyup(gbaKey);
                }
            };

            el.addEventListener('touchstart', press, { passive: false });
            el.addEventListener('touchend', release, { passive: false });
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
        }

        const checkGBA = setInterval(() => {
            if (gba && gba.keypad) {
                // 這裡傳入的是 GBA 鍵盤映射碼
                bind('u', gba.keypad.UP);
                bind('d', gba.keypad.DOWN);
                bind('l', gba.keypad.LEFT);
                bind('r', gba.keypad.RIGHT);
                bind('a', gba.keypad.A);
                bind('b', gba.keypad.B);
                bind('st', gba.keypad.START);
                bind('se', gba.keypad.SELECT);
                clearInterval(checkGBA);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">庭瑜生日快樂🎂25 forever</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('Copied'));" style="background:var(--p); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:bold;">生成連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter" style="padding:20px; font-family: monospace; line-height: 1.6;"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p); font-size:12px;">● CLICK TO ADVENTURE ●</div>
    </div>

    <div id="game-area">
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div class="pad">
        <div class="row">
            <div class="k sys" id="st">START</div>
            <div class="k" id="u">↑</div>
            <div class="k sys" id="se">SELECT</div>
        </div>
        <div class="row">
            <div class="k" id="l">←</div>
            <div class="k" id="d">↓</div>
            <div class="k" id="r">→</div>
        </div>
        <div class="row" style="gap: 50px; margin-top: 5px;">
            <div class="k" id="b" style="background:rgba(255,80,80,0.2);">B</div>
            <div class="k" id="a" style="background:rgba(80,255,80,0.2);">A</div>
        </div>
    </div>

</body>
</html>
