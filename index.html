<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script><script src="js/core.js"></script>
    <script src="js/arm.js"></script><script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script><script src="js/io.js"></script>
    <script src="js/audio.js"></script><script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script><script src="js/video/software.js"></script>
    <script src="js/irq.js"></script><script src="js/keypad.js"></script>
    <script src="js/sio.js"></script><script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script><script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; --gb-body: #1a1a1a; --gb-grey: #2d2d2d; --gb-red: #a31a48; --screen-green: #9bbc0f; }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; outline: none; box-sizing: border-box; }
        body { background: var(--gb-body); color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        #game-area { width: 100vw; height: 42vh; display: flex; justify-content: center; align-items: center; }

        /* 外框：維持結構穩定 */
        .screen-frame {
            position: relative;
            background: #333;
            width: 90vw; max-width: 420px; 
            aspect-ratio: 1.5 / 1;
            border-radius: 12px 12px 55px 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }

        /* 黑色內框：這是絕對參考系 */
        #screen-inner {
            position: relative;
            width: 90%; height: 82%;
            background: #000;
            border: 3px solid #111;
            overflow: hidden; /* 確保超出部分被裁掉，不影響外框 */
            display: flex; justify-content: center; align-items: center;
        }

        /* 畫布：解決「只顯示左上角」的關鍵 */
        canvas { 
            display: none; 
            position: absolute;
            top: 50%; left: 50%;
            /* 核心：用 translate(-50%, -50%) 強制將畫面的「正中心」對準黑框的「正中心」 */
            transform: translate(-50%, -50%) scale(1.3); 
            transform-origin: center center;
            width: 100% !important; 
            height: auto !important;
            image-rendering: pixelated; 
            z-index: 5;
        }

        #intro-layer {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #0f380f; font-family: monospace; font-weight: bold;
            padding: 15px; text-align: center; z-index: 100;
            background: var(--screen-green);
        }

        /* 跑馬燈：修正寬度與疊加順序 */
        #marquee-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.85); 
            color: #fff; font-size: 15px; font-weight: bold;
            padding: 6px 0; white-space: nowrap; overflow: hidden;
            display: none; z-index: 110;
        }
        #marquee-text { display: inline-block; padding-left: 100%; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* 控制器：優化 D-Pad 視覺感 */
        .gb-controls { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: space-evenly; padding: 0 35px; padding-bottom: env(safe-area-inset-bottom, 25px); }
        .main-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .d-pad { position: relative; width: 125px; height: 125px; }
        .d-pad .k { position: absolute; background: var(--gb-grey); box-shadow: 0 4px 0 #000; border: 1px solid #111; z-index: 10; }
        #btn-u { top: 0; left: 44px; width: 37px; height: 48px; border-radius: 4px 4px 0 0; }
        #btn-d { bottom: 0; left: 44px; width: 37px; height: 48px; border-radius: 0 0 4px 4px; }
        #btn-l { left: 0; top: 44px; width: 48px; height: 37px; border-radius: 4px 0 0 4px; }
        #btn-r { right: 0; top: 44px; width: 48px; height: 37px; border-radius: 0 4px 4px 0; }
        .d-pad::after { content:''; position:absolute; top:44px; left:44px; width:37px; height:37px; background:var(--gb-grey); z-index:11; }

        .action-btns { position: relative; width: 150px; height: 120px; }
        .round-k { position: absolute; width: 62px; height: 62px; border-radius: 50%; background: var(--gb-red); border: 2px solid #500; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; color: rgba(255,255,255,0.7); box-shadow: 0 6px 0 #500; }
        #btn-b { left: 0; bottom: 0; }
        #btn-a { right: 0; top: 0; }

        .sys-row { display: flex; justify-content: center; gap: 45px; }
        .oval-k { width: 56px; height: 20px; background: #444; border-radius: 10px; transform: rotate(-25deg); box-shadow: 0 3px 0 #111; }
        .sys-label { font-size: 11px; color: #444; font-weight: bold; transform: rotate(-25deg); margin-top: 6px; }

        #setup-ui { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;
        const K = { UP:38, DOWN:40, LEFT:37, RIGHT:39, A:90, B:88, START:13, SELECT:16 };

        try { gba = new GameBoyAdvance(); } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = decodeURIComponent(msgParam);
                document.getElementById('marquee-text').innerText = " ★ " + customMsg + " ★ ";
                type();
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('type-content');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 100);
            } else { document.getElementById('start-hint').style.opacity = 1; }
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            if (gba.audio && gba.audio.context) gba.audio.context.resume();
            try {
                const res = await fetch("game.gba");
                const blob = await res.blob();
                gba.loadRomFromFile(new File([blob], "game.gba"), (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-layer').style.display = 'none';
                        document.getElementById('screen').style.display = 'block';
                        document.getElementById('marquee-bar').style.display = 'block';
                    }
                });
            } catch (e) { alert("ROM Load Failed"); }
        }

        function triggerKey(code, type) {
            const event = new KeyboardEvent(type, { keyCode: code, which: code, bubbles: true });
            window.dispatchEvent(event);
        }

        function setupBtn(id, keyCode) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                if(id === 'btn-st') runGame();
                triggerKey(keyCode, 'keydown'); 
            }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); triggerKey(keyCode, 'keyup'); }, {passive: false});
        }

        const init = setInterval(() => {
            if (gba) {
                const buttons = ['btn-u','btn-d','btn-l','btn-r','btn-a','btn-b','btn-st','btn-se'];
                const keys = [K.UP, K.DOWN, K.LEFT, K.RIGHT, K.A, K.B, K.START, K.SELECT];
                buttons.forEach((id, idx) => setupBtn(id, keys[idx]));
                clearInterval(init);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">親愛的Serena❤️早安</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('連結已複製'));" style="background:var(--p); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:bold;">生成連結</button>
    </div>

    <div id="game-area">
        <div class="screen-frame">
            <div id="screen-inner">
                <div id="intro-layer">
                    <div id="type-content"></div>
                    <div id="start-hint" style="margin-top:20px; opacity:0; font-size:10px; animation: blink 1s infinite;">● PRESS START ●</div>
                </div>
                <div id="marquee-bar"><span id="marquee-text"></span></div>
                <canvas id="screen" width="240" height="160"></canvas>
            </div>
        </div>
    </div>

    <div class="gb-controls">
        <div class="main-row">
            <div class="d-pad">
                <div class="k" id="btn-u"></div><div class="k" id="btn-d"></div>
                <div class="k" id="btn-l"></div><div class="k" id="btn-r"></div>
            </div>
            <div class="action-btns">
                <div class="round-k" id="btn-b">B</div>
                <div class="round-k" id="btn-a">A</div>
            </div>
        </div>
        <div class="sys-row">
            <div class="sys-group"><div class="oval-k" id="btn-se"></div><div class="sys-label">SELECT</div></div>
            <div class="sys-group"><div class="oval-k" id="btn-st"></div><div class="sys-label">START</div></div>
        </div>
        <div style="text-align:center; color:#383838; font-size:10px; font-weight:bold; letter-spacing:4px; margin-top:10px;">Nintendo GAME BOY</div>
    </div>

</body>
</html>
