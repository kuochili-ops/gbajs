<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/video/software.js"></script>
    <script src="js/irq.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/sio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        * { -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 畫面容器：確保 3:2 且不溢出 */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 38vh;
            display: flex; align-items: center; justify-content: center;
            margin-top: env(safe-area-inset-top, 20px);
            background: #000;
        }
        #screen-container {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }

        /* 跑馬燈注入：現在它真的在遊戲畫面「裡面」 */
        #ingame-marquee {
            position: absolute;
            top: 5px; /* 放在遊戲畫面頂部 */
            width: 100%;
            background: rgba(107, 80, 156, 0.4); /* 半透明紫色 */
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            pointer-events: none;
            z-index: 100;
            display: none;
        }
        #marquee-content { display: inline-block; padding-left: 100%; animation: scroll 12s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* 控制器優化：加入 Start/Select */
        .controls-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            width: 90%; 
            margin-top: auto;
            padding-bottom: env(safe-area-inset-bottom, 30px);
        }
        .k { 
            aspect-ratio: 1;
            background: rgba(255,255,255,0.1); 
            border: 2px solid #444; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; font-weight: bold; color: #fff;
        }
        .small-k { 
            aspect-ratio: 2/1; 
            border-radius: 10px; 
            font-size: 12px; 
            height: 35px; 
        }
        .k:active { background: var(--p); transform: scale(0.9); }

        /* 打字機與設定 */
        #setup-ui, #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        #typewriter { font-family: monospace; font-size: 18px; line-height: 1.6; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;

        try {
            gba = new GameBoyAdvance();
            gba.keypad.eatInput = true;
        } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = decodeURIComponent(msgParam);
                document.getElementById('marquee-content').innerText = " 𓃥 " + customMsg + " 𓃥 ";
                type();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 60);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            
            // 解鎖音訊 (iOS 關鍵)
            if (gba.audio && gba.audio.context) {
                gba.audio.context.resume();
                // 播放一個靜音片段來強制啟動
                const buffer = gba.audio.context.createBuffer(1, 1, 22050);
                const source = gba.audio.context.createBufferSource();
                source.buffer = buffer;
                source.connect(gba.audio.context.destination);
                source.start(0);
            }

            try {
                const response = await fetch("game.gba");
                const blob = await response.blob();
                const file = new File([blob], "game.gba");
                gba.loadRomFromFile(file, (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                        document.getElementById('ingame-marquee').style.display = 'block';
                    }
                });
            } catch (e) { alert("讀取失敗"); }
        }

        function bind(id, key) {
            const el = document.getElementById(id);
            const press = (e) => { e.preventDefault(); gba.keypad.keydown(key); };
            const release = (e) => { e.preventDefault(); gba.keypad.keyup(key); };
            el.addEventListener('touchstart', press, {passive: false});
            el.addEventListener('touchend', release, {passive: false});
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
        }

        const timer = setInterval(() => {
            if (gba && gba.keypad) {
                bind('btn-l', gba.keypad.LEFT);
                bind('btn-r', gba.keypad.RIGHT);
                bind('btn-u', gba.keypad.UP);
                bind('btn-d', gba.keypad.DOWN);
                bind('btn-a', gba.keypad.A);
                bind('btn-b', gba.keypad.B);
                bind('btn-st', gba.keypad.START);
                bind('btn-se', gba.keypad.SELECT);
                clearInterval(timer);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput" style="width:80%; height:100px; background:#111; color:#fff; border:1px solid var(--p); border-radius:10px; padding:10px;">庭瑜生日快樂🎂25 forever</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('連結已複製'));" style="background:var(--p); color:#fff; border:none; padding:10px 20px; border-radius:20px;">複製專屬連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p);">● 點擊開啟 (請確認靜音開關已關閉) ●</div>
    </div>

    <div id="game-wrapper">
        <div id="screen-container">
            <div id="ingame-marquee"><span id="marquee-content"></span></div>
            <canvas id="screen" width="240" height="160"></canvas>
        </div>
    </div>

    <div class="controls-grid">
        <div class="k small-k" id="btn-st">START</div>
        <div class="k" id="btn-u">↑</div>
        <div class="k small-k" id="btn-se">SELECT</div>
        
        <div class="k" id="btn-l">←</div>
        <div class="k" id="btn-d">↓</div>
        <div class="k" id="btn-r">→</div>
        
        <div></div> <div class="k" id="btn-b" style="background:rgba(255,0,0,0.2)">B</div>
        <div class="k" id="btn-a" style="background:rgba(0,255,0,0.2)">A</div>
    </div>

</body>
</html>
