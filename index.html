<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/video/software.js"></script>
    <script src="js/irq.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/sio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        * { -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; outline: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 35vh;
            display: flex; align-items: center; justify-content: center;
            margin-top: env(safe-area-inset-top, 10px);
            background: #000;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; border: 1px solid #222; }

        /* 設定與遮罩保持不變 */
        #setup-ui, #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #typewriter { font-family: monospace; font-size: 18px; line-height: 1.6; }

        /* 控制器：優化排列 */
        .controls-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 12px; width: 90%; 
            margin-top: auto; padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .k { 
            aspect-ratio: 1; background: rgba(255,255,255,0.1); 
            border: 1px solid #444; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; font-weight: bold; color: #fff;
        }
        .small-k { aspect-ratio: 2.2/1; border-radius: 8px; font-size: 11px; height: 32px; background: rgba(255,255,255,0.05); }
        .k:active { background: var(--p); transform: scale(0.9); }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;
        var marqueePos = 240;

        try {
            gba = new GameBoyAdvance();
            gba.keypad.eatInput = true;
        } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = decodeURIComponent(msgParam).replace(/\n/g, " | ");
                type();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 50);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        // 訊息注入遊戲 Canvas 的繪圖循環
        function startMarquee() {
            const canvas = document.getElementById('screen');
            const ctx = canvas.getContext('2d');
            
            function draw() {
                if (gba && gba.context) {
                    // 繪製跑馬燈
                    ctx.fillStyle = "rgba(0,0,0,0.4)";
                    ctx.fillRect(0, 0, 240, 18);
                    ctx.font = "12px monospace";
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(customMsg, marqueePos, 13);
                    
                    marqueePos -= 1.2;
                    if (marqueePos < -ctx.measureText(customMsg).width) {
                        marqueePos = 240;
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            
            // 聲音深度解鎖
            if (gba.audio && gba.audio.context) {
                if (gba.audio.context.state === 'suspended') gba.audio.context.resume();
            }

            try {
                const response = await fetch("game.gba");
                const blob = await response.blob();
                const file = new File([blob], "game.gba");
                gba.loadRomFromFile(file, (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                        startMarquee(); // 啟動畫布內部的跑馬燈
                    }
                });
            } catch (e) { alert("ERROR"); }
        }

        // 暴力按鍵綁定：直接禁止所有預設行為
        function bind(id, gbaKey) {
            const el = document.getElementById(id);
            const down = (e) => { 
                e.preventDefault(); 
                e.stopPropagation();
                gba.keypad.keydown(gbaKey); 
            };
            const up = (e) => { 
                e.preventDefault(); 
                e.stopPropagation();
                gba.keypad.keyup(gbaKey); 
            };
            
            el.addEventListener('touchstart', down, {passive: false});
            el.addEventListener('touchend', up, {passive: false});
            el.addEventListener('mousedown', down);
            el.addEventListener('mouseup', up);
        }

        const timer = setInterval(() => {
            if (gba && gba.keypad) {
                bind('btn-l', gba.keypad.LEFT);
                bind('btn-r', gba.keypad.RIGHT);
                bind('btn-u', gba.keypad.UP);
                bind('btn-d', gba.keypad.DOWN);
                bind('btn-a', gba.keypad.A);
                bind('btn-b', gba.keypad.B);
                bind('btn-st', gba.keypad.START);
                bind('btn-se', gba.keypad.SELECT);
                clearInterval(timer);
            }
        }, 200);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">庭瑜生日快樂🎂25 forever</textarea><br>
        <button onclick="const url = window.location.origin + window.location.pathname + '?msg=' + encodeURIComponent(document.getElementById('msgInput').value); navigator.clipboard.writeText(url).then(() => alert('LINK COPIED'));" style="background:var(--p); color:#fff; border:none; padding:10px 20px; border-radius:20px;">生成連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p); font-size:12px;">● CLICK TO START (請關閉靜音撥桿) ●</div>
    </div>

    <div id="game-wrapper">
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div class="controls-grid">
        <div class="k small-k" id="btn-st">START</div>
        <div class="k" id="btn-u">↑</div>
        <div class="k small-k" id="btn-se">SELECT</div>
        
        <div class="k" id="btn-l">←</div>
        <div class="k" id="btn-d">↓</div>
        <div class="k" id="btn-r">→</div>
        
        <div class="k small-k" style="border:none; background:none;">V13.0</div>
        <div class="k" id="btn-b" style="color:#ff5555; border-color:#ff5555;">B</div>
        <div class="k" id="btn-a" style="color:#55ff55; border-color:#55ff55;">A</div>
    </div>

</body>
</html>
