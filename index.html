<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/video/software.js"></script>
    <script src="js/irq.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/sio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 畫面深度優化：解決裁切問題 */
        #screen-container { 
            position: relative; 
            width: 95vw; 
            max-width: 480px; 
            max-height: 35vh; /* 限制高度，防止擋住下方按鈕 */
            aspect-ratio: 3 / 2;
            margin-top: env(safe-area-inset-top, 20px); 
            background: #000; 
            border: 2px solid #222; 
            display: flex; align-items: center; justify-content: center;
        }
        canvas { 
            max-width: 100%; max-height: 100%; 
            object-fit: contain; image-rendering: pixelated; 
        }

        /* 跑馬燈樣式 */
        #marquee-container {
            position: absolute; top: 0; width: 100%; background: rgba(0,0,0,0.6);
            color: #fff; font-size: 14px; padding: 5px 0; overflow: hidden; white-space: nowrap; z-index: 50; pointer-events: none;
        }
        #marquee-text { display: inline-block; padding-left: 100%; animation: scroll 15s linear infinite; }
        @keyframes scroll { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* 設定與遮罩 */
        #setup-ui { position: fixed; inset: 0; background: #111; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        textarea { width: 85%; height: 120px; background: #000; color: #fff; border: 1px solid var(--p); border-radius: 10px; padding: 12px; font-size: 16px; margin: 15px 0; }
        .btn-gen { background: var(--p); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; }

        #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        #typewriter { font-family: monospace; font-size: 18px; white-space: pre-wrap; min-height: 100px; }
        .hint { margin-top: 40px; color: var(--p); font-size: 13px; opacity: 0; transition: 1s; }

        /* 控制器：加大間距與觸發面積 */
        .controls { 
            flex-grow: 1; display: flex; align-items: center; justify-content: center; 
            gap: 25px; width: 100%; padding-bottom: env(safe-area-inset-bottom, 40px);
        }
        .k { 
            width: 85px; height: 85px; background: rgba(255,255,255,0.1); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; border: 2px solid #333; touch-action: none;
        }
        .k:active { background: var(--p); transform: scale(0.9); }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;

        try {
            gba = new GameBoyAdvance();
            gba.keypad.eatInput = true;
        } catch (e) { console.error(e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = decodeURIComponent(msgParam);
                // 跑馬燈同步訊息
                document.getElementById('marquee-text').innerText = customMsg.replace(/\n/g, " | ");
                type();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 60);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        async function runGame() {
            if (charIndex < customMsg.length) return;
            try {
                // 強制喚醒音訊
                if (gba.audio && gba.audio.context) {
                    gba.audio.context.resume();
                }
                const response = await fetch("game.gba");
                const blob = await response.blob();
                const file = new File([blob], "game.gba");
                gba.loadRomFromFile(file, (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                    }
                });
            } catch (e) { console.error(e); }
        }

        // 生成連結
        function generateLink() {
            const text = document.getElementById('msgInput').value;
            const finalUrl = window.location.origin + window.location.pathname + "?msg=" + encodeURIComponent(text);
            navigator.clipboard.writeText(finalUrl).then(() => alert("連結已複製！傳送此連結給朋友即可。"));
        }

        // 修復按鍵邏輯
        function bind(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); gba.keypad.keydown(key); };
            const end = (e) => { e.preventDefault(); gba.keypad.keyup(key); };
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
        }

        const timer = setInterval(() => {
            if (gba && gba.keypad) {
                bind('btn-left', gba.keypad.LEFT);
                bind('btn-right', gba.keypad.RIGHT);
                bind('btn-a', gba.keypad.A);
                clearInterval(timer);
            }
        }, 300);
    </script>
</head>
<body>

    <div id="setup-ui">
        <h2>🛠️ 數位禮物生成器</h2>
        <textarea id="msgInput">System: White 6 Project
你好，這是一個專屬於你的空間。</textarea>
        <button class="btn-gen" onclick="generateLink()">複製專屬連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter"></div>
        <div class="hint" id="hint">● 點擊螢幕開啟冒險 (解除靜音) ●</div>
    </div>

    <div id="screen-container">
        <div id="marquee-container">
            <span id="marquee-text"></span>
        </div>
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div class="controls">
        <div class="k" id="btn-left">←</div>
        <div class="k" id="btn-a">A</div>
        <div class="k" id="btn-right">→</div>
    </div>

</body>
</html>
