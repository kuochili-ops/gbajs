<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>

    <style>
        :root { --p: #6b509c; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 螢幕容器 */
        #screen-container { position: relative; width: 320px; height: 213px; margin-top: 40px; background: #111; border: 4px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(107, 80, 156, 0.3); }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }

        /* 打字機遮罩 */
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; padding: 30px; box-sizing: border-box; }
        #typewriter { font-family: "Courier New", monospace; font-size: 18px; line-height: 1.6; min-height: 120px; white-space: pre-wrap; }
        .hint { margin-top: 50px; color: var(--p); font-size: 13px; opacity: 0; transition: 1s; letter-spacing: 2px; }

        /* 虛擬按鍵 */
        .controls { display: flex; gap: 40px; margin-top: 60px; padding-bottom: 40px; }
        .k { width: 80px; height: 80px; background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #444; touch-action: none; -webkit-user-select: none; }
        .k:active { background: var(--p); transform: scale(0.9); border-color: #fff; }
        
        #status { margin-top: 15px; font-size: 11px; color: #444; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div id="typewriter"></div>
        <div class="hint" id="hint">● 點擊螢幕開啟冒險 ●</div>
    </div>

    <div id="screen-container">
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div id="status">INIT_CORE...</div>

    <div class="controls">
        <div class="k" id="btn-left">←</div>
        <div class="k" id="btn-a">A</div>
        <div class="k" id="btn-right">→</div>
    </div>

    <script>
        const message = "System: White 6 Forked Project\n--------------------------\nAccessing Digital Gift...\n\n你好，Serena。\n這是一個專屬於妳的互動空間。";
        let charIndex = 0;
        let gba;

        // 1. 打字機邏輯
        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < message.length) {
                container.innerHTML += message.charAt(charIndex);
                charIndex++;
                setTimeout(type, 70);
            } else {
                document.getElementById('hint').style.opacity = 1;
            }
        }

        // 2. 模擬器初始化
        window.onload = async () => {
            type();
            const statusEl = document.getElementById('status');
            
            try {
                gba = new GameBoyAdvance();
                gba.setCanvas(document.getElementById('screen'));
                
                statusEl.innerText = "正在加載遊戲數據...";
                const response = await fetch("game.gba");
                if (!response.ok) throw new Error("ROM_404");
                
                const buffer = await response.arrayBuffer();
                gba.loadRom(buffer, (res) => {
                    statusEl.innerText = "✅ 系統準備就緒";
                });
            } catch (e) {
                statusEl.innerText = "❌ 錯誤: 請確認 game.gba 存在於根目錄";
            }
        };

        // 3. 點擊進入遊戲
        document.getElementById('intro-overlay').onclick = function() {
            if (charIndex >= message.length) {
                this.style.opacity = 0;
                setTimeout(() => this.style.display = 'none', 500);
                if (gba) {
                    gba.run();
                    if (gba.audio && gba.audio.context) gba.audio.context.resume();
                }
            }
        };

        // 4. 手機虛擬按鍵綁定
        function bind(id, key) {
            const el = document.getElementById(id);
            const keypad = gba.keypad;
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keypad.keydown(key);
            });
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                keypad.keyup(key);
            });
        }

        // A=0, LEFT=5, RIGHT=4 (gbajs 標準映射)
        const checkGBA = setInterval(() => {
            if (gba && gba.keypad) {
                bind('btn-a', 0);
                bind('btn-left', 5);
                bind('btn-right', 4);
                clearInterval(checkGBA);
            }
        }, 500);
    </script>
</body>
</html>
