<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/video/software.js"></script>
    <script src="js/irq.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/sio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        #screen-container { position: relative; width: 320px; height: 213px; margin-top: 40px; background: #111; border: 4px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(107, 80, 156, 0.3); }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }

        /* 打字機遮罩 */
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; padding: 30px; box-sizing: border-box; }
        #typewriter { font-family: "Courier New", monospace; font-size: 18px; line-height: 1.6; min-height: 120px; white-space: pre-wrap; }
        .hint { margin-top: 50px; color: var(--p); font-size: 13px; opacity: 0; transition: 1s; letter-spacing: 2px; }

        /* 虛擬按鍵 */
        .controls { display: flex; gap: 40px; margin-top: 60px; }
        .k { width: 80px; height: 80px; background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #444; touch-action: none; -webkit-user-select: none; font-size: 20px; color: #eee; }
        .k:active { background: var(--p); transform: scale(0.9); border-color: #fff; }
        
        #status { margin-top: 15px; font-size: 11px; color: #444; letter-spacing: 1px; }
    </style>

    <script>
        var gba;
        const message = "System: White 6 Project v6.0\n--------------------------\nTarget: Serena\nStatus: Link Stable\n\n你好，Serena。\n這是一個專屬於妳的遊戲空間。";
        let charIndex = 0;

        // 打字機效果
        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < message.length) {
                container.innerHTML += message.charAt(charIndex);
                charIndex++;
                setTimeout(type, 70);
            } else {
                document.getElementById('hint').style.opacity = 1;
            }
        }

        // 核心初始化 (參考官方邏輯)
        try {
            gba = new GameBoyAdvance();
            gba.keypad.eatInput = true;
        } catch (exception) {
            gba = null;
        }

        window.onload = function() {
            type();
            if (gba) {
                var canvas = document.getElementById('screen');
                gba.setCanvas(canvas);
                gba.logLevel = gba.LOG_ERROR;

                // 自動載入根目錄的 game.gba
                var statusEl = document.getElementById('status');
                statusEl.innerText = "正在同步遠端數據...";

                // 使用官方 xhr.js 提供的 loadRom 功能 (如果有的話) 或是標準 fetch
                fetch("game.gba?v=" + Date.now())
                    .then(res => {
                        if (!res.ok) throw new Error("ROM_NOT_FOUND");
                        return res.arrayBuffer();
                    })
                    .then(buffer => {
                        gba.loadRom(buffer, function(result) {
                            if (result) {
                                statusEl.innerText = "✅ 數據同步完成";
                            } else {
                                statusEl.innerText = "❌ 數據解析失敗";
                            }
                        });
                    })
                    .catch(err => {
                        statusEl.innerText = "❌ 無法讀取 game.gba";
                    });
            }
        }

        // 進入遊戲
        function startAdventure() {
            if (charIndex >= message.length) {
                var overlay = document.getElementById('intro-overlay');
                overlay.style.opacity = 0;
                setTimeout(() => overlay.style.display = 'none', 500);
                if (gba) {
                    gba.runStable();
                    if (gba.audio && gba.audio.context) gba.audio.context.resume();
                }
            }
        }

        // 按鍵綁定
        function bind(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); gba.keypad.keydown(key); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); gba.keypad.keyup(key); });
        }

        const checkGBA = setInterval(() => {
            if (gba && gba.keypad) {
                bind('btn-a', gba.keypad.A);
                bind('btn-left', gba.keypad.LEFT);
                bind('btn-right', gba.keypad.RIGHT);
                clearInterval(checkGBA);
            }
        }, 500);
    </script>
</head>
<body>

    <div id="intro-overlay" onclick="startAdventure()">
        <div id="typewriter"></div>
        <div class="hint" id="hint">● 點擊螢幕開啟冒險 ●</div>
    </div>

    <div id="screen-container">
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div id="status">INIT_CORE...</div>

    <div class="controls">
        <div class="k" id="btn-left">←</div>
        <div class="k" id="btn-a">A</div>
        <div class="k" id="btn-right">→</div>
    </div>

</body>
</html>
