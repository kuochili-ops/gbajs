<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/video/software.js"></script>
    <script src="js/irq.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/sio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script> <style>
        :root { --p: #6b509c; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        #screen-container { position: relative; width: 320px; height: 213px; margin-top: 40px; background: #111; border: 4px solid #333; border-radius: 8px; overflow: hidden; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; padding: 30px; box-sizing: border-box; }
        #typewriter { font-family: "Courier New", monospace; font-size: 18px; line-height: 1.6; min-height: 120px; white-space: pre-wrap; }
        .hint { margin-top: 50px; color: var(--p); font-size: 13px; opacity: 0; transition: 1s; }
        .controls { display: flex; gap: 40px; margin-top: 60px; }
        .k { width: 80px; height: 80px; background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #444; touch-action: none; -webkit-user-select: none; font-size: 20px; }
        .k:active { background: var(--p); transform: scale(0.9); }
        #status { margin-top: 15px; font-size: 11px; color: #444; }
    </style>

    <script>
        var gba;
        const message = "System: White 6 Project v7.0\n--------------------------\nAccessing local resources...\n\n你好，Serena。\n這是一個專屬於妳的遊戲空間。";
        let charIndex = 0;

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < message.length) {
                container.innerHTML += message.charAt(charIndex);
                charIndex++;
                setTimeout(type, 70);
            } else {
                document.getElementById('hint').style.opacity = 1;
            }
        }

        window.onload = function() {
            type();
            try {
                gba = new GameBoyAdvance();
                gba.setCanvas(document.getElementById('screen'));
                gba.logLevel = gba.LOG_ERROR;

                var statusEl = document.getElementById('status');
                statusEl.innerText = "正在調用 XHR 加載數據...";

                // 使用官方 resources/xhr.js 裡的 loadRom 函數
                // 這會處理 ArrayBuffer 的轉換，避開 fetch 可能的 MIME 問題
                loadRom('game.gba', function(buffer) {
                    if (buffer) {
                        gba.loadRom(buffer, function(result) {
                            if (result) {
                                statusEl.innerText = "✅ 數據同步完成";
                            } else {
                                statusEl.innerText = "❌ ROM 解析失敗";
                            }
                        });
                    } else {
                        statusEl.innerText = "❌ 檔案讀取失敗 (請檢查檔案名稱)";
                    }
                });
            } catch (e) {
                document.getElementById('status').innerText = "❌ 初始化異常: " + e.message;
            }
        }

        function start() {
            if (charIndex >= message.length) {
                document.getElementById('intro-overlay').style.display = 'none';
                if (gba) {
                    gba.runStable();
                    if (gba.audio && gba.audio.context) gba.audio.context.resume();
                }
            }
        }

        function bind(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); gba.keypad.keydown(key); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); gba.keypad.keyup(key); });
        }

        setInterval(() => {
            if (gba && gba.keypad) {
                bind('btn-a', gba.keypad.A);
                bind('btn-left', gba.keypad.LEFT);
                bind('btn-right', gba.keypad.RIGHT);
            }
        }, 1000);
    </script>
</head>
<body>
    <div id="intro-overlay" onclick="start()">
        <div id="typewriter"></div>
        <div class="hint" id="hint">● 點擊螢幕開啟冒險 ●</div>
    </div>
    <div id="screen-container">
        <canvas id="screen" width="240" height="160"></canvas>
    </div>
    <div id="status">READY</div>
    <div class="controls">
        <div class="k" id="btn-left">←</div>
        <div class="k" id="btn-a">A</div>
        <div class="k" id="btn-right">→</div>
    </div>
</body>
</html>
