<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𓃥 白六 互動實驗室</title>
    
    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arm.js"></script>
    <script src="js/thumb.js"></script>
    <script src="js/mmu.js"></script>
    <script src="js/io.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/video/proxy.js"></script>
    <script src="js/video/software.js"></script>
    <script src="js/irq.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/sio.js"></script>
    <script src="js/savedata.js"></script>
    <script src="js/gpio.js"></script>
    <script src="js/gba.js"></script>
    <script src="resources/xhr.js"></script>

    <style>
        :root { --p: #6b509c; }
        * { -webkit-tap-highlight-color: transparent; outline: none; touch-action: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 1. 畫面完整顯示解決方案 */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 40vh; /* 限制高度，確保下方有空間給按鈕 */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: env(safe-area-inset-top, 20px);
        }
        #screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            image-rendering: pixelated;
        }

        /* 2. 訊息注入遊戲畫面 (疊加層) */
        #ingame-msg {
            position: absolute;
            bottom: 10%;
            width: 80%;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            padding: 5px 10px;
            border-left: 3px solid var(--p);
            pointer-events: none; /* 不擋住點擊 */
            z-index: 100;
            display: none; /* 遊戲開始後才顯示 */
        }

        /* 設定與遮罩 */
        #setup-ui { position: fixed; inset: 0; background: #111; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; cursor: pointer; }
        #typewriter { font-family: monospace; font-size: 18px; line-height: 1.6; }

        /* 3. 按鍵深度優化 */
        .controls { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 30px; 
            width: 100%;
            padding-bottom: env(safe-area-inset-bottom, 40px);
        }
        .k { 
            width: 85px; height: 85px; 
            background: rgba(255,255,255,0.15); 
            border: 2px solid #444; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; color: #fff; font-weight: bold;
            user-select: none;
        }
        .k:active { background: var(--p); transform: scale(0.92); border-color: #fff; }
    </style>

    <script>
        var gba;
        var customMsg = "";
        var charIndex = 0;

        // 初始化模擬器
        try {
            gba = new GameBoyAdvance();
            gba.keypad.eatInput = true;
        } catch (e) { console.error("GBA Init Error", e); }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const msgParam = params.get('msg');
            if (msgParam) {
                document.getElementById('setup-ui').style.display = 'none';
                customMsg = decodeURIComponent(msgParam);
                document.getElementById('ingame-msg').innerText = customMsg;
                type();
            } else {
                document.getElementById('intro-overlay').style.display = 'none';
            }
            if (gba) {
                gba.setCanvas(document.getElementById('screen'));
                loadRom('resources/bios.bin', (bios) => bios && gba.setBios(bios));
            }
        };

        function type() {
            const container = document.getElementById('typewriter');
            if (charIndex < customMsg.length) {
                container.innerHTML += customMsg.charAt(charIndex);
                charIndex++;
                setTimeout(type, 60);
            } else { document.getElementById('hint').style.opacity = 1; }
        }

        // 解決音效與啟動
        async function runGame() {
            if (charIndex < customMsg.length) return;
            
            // 關鍵：在使用者點擊的當下立即啟動 AudioContext
            if (gba.audio && gba.audio.context) {
                gba.audio.context.resume().then(() => {
                    console.log("Audio Context Resumed");
                });
            }

            try {
                const response = await fetch("game.gba");
                const blob = await response.blob();
                const file = new File([blob], "game.gba");
                gba.loadRomFromFile(file, (result) => {
                    if (result) {
                        gba.runStable();
                        document.getElementById('intro-overlay').style.display = 'none';
                        document.getElementById('ingame-msg').style.display = 'block'; // 顯示遊戲內訊息
                    }
                });
            } catch (e) { alert("讀取失敗"); }
        }

        // 生成連結
        function generateLink() {
            const text = document.getElementById('msgInput').value;
            const url = window.location.origin + window.location.pathname + "?msg=" + encodeURIComponent(text);
            navigator.clipboard.writeText(url).then(() => alert("連結已複製"));
        }

        // 深度綁定按鍵 (解決反白與沒反應)
        function forceBind(id, gbaKey) {
            const el = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                gba.keypad.keydown(gbaKey);
            };
            const end = (e) => {
                e.preventDefault();
                gba.keypad.keyup(gbaKey);
            };
            
            // 同時監聽觸摸與滑鼠
            el.addEventListener('touchstart', start, { passive: false });
            el.addEventListener('touchend', end, { passive: false });
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        const checkGBA = setInterval(() => {
            if (gba && gba.keypad) {
                forceBind('btn-left', gba.keypad.LEFT);
                forceBind('btn-right', gba.keypad.RIGHT);
                forceBind('btn-a', gba.keypad.A);
                clearInterval(checkGBA);
            }
        }, 200);
    </script>
</head>
<body>

    <div id="setup-ui">
        <textarea id="msgInput">System: White 6 Project</textarea>
        <button onclick="generateLink()">複製連結</button>
    </div>

    <div id="intro-overlay" onclick="runGame()">
        <div id="typewriter"></div>
        <div id="hint" style="margin-top:40px; opacity:0; color:var(--p);">● 點擊開啟 (請開啟側邊聲音開關) ●</div>
    </div>

    <div id="game-wrapper">
        <div id="screen-container">
            <div id="ingame-msg"></div> <canvas id="screen" width="240" height="160"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="k" id="btn-left">←</div>
        <div class="k" id="btn-a">A</div>
        <div class="k" id="btn-right">→</div>
    </div>

</body>
</html>
